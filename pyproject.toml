[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenly-auth"
version = "1.1.4"
authors = [
  { name="err0rgod", email="nirbhayerror@gmail.com" },
]
description = "A professional-grade, database-agnostic authentication and session management utility library."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
keywords = [
  "authentication",
  "authorization",
  "argon2",
  "jwt",
  "password-hashing",
  "refresh-tokens",
  "rate-limiting",
  "security",
  "database-agnostic",
  "framework-agnostic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "revlimiter",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
"Homepage" = "https://github.com/err0rgod/tokenly"
"Documentation" = "https://err0rgod.github.io/tokenly-auth-docs/"
"Bug Tracker" = "https://github.com/err0rgod/tokenly/issues"
"Changelog" = "https://github.com/err0rgod/tokenly/blob/main/CHANGELOG.md"
"Source" = "https://github.com/err0rgod/tokenly"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenly_auth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["tokenly_auth"]
branch = true

[tool.ruff]
# Target Python version
target-version = "py39"

# Same as Black.
line-length = 100

[tool.ruff.lint]
# Enable Pyflakes (F) and a subset of the pycodestyle (E) codes by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Use profile "black" for formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
