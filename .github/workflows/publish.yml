name: Publish to PyPI

# Publishing uses PyPI Trusted Publishing (OIDC): no API token secret to rot or leak.
# One-time setup, done by a maintainer on PyPI:
#   pypi.org -> Your projects -> tokenly-auth -> Publishing
#     Owner: err0rgod   Repository: tokenly   Workflow: publish.yml   Environment: pypi
# (For a brand-new project, add it as a "pending publisher" first.)
#
# Then: cut a GitHub Release -> this workflow builds, checks, and uploads.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm a manual upload'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    if: github.event_name == 'release' || inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          rm -rf dist/ build/ *.egg-info/
          python -m build

      - name: Check metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - name: Refuse a dirty tree (untracked build artifacts in git)
        run: |
          if git ls-files --error-unmatch dist >/dev/null 2>&1; then
            echo "::error::dist/ is tracked in git — remove it before publishing"; exit 1
          fi

      - name: Upload distributions as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tokenly-auth/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
